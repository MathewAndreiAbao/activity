name: Build Android APK

# Builds the web app, generates the native Android project with Capacitor,
# compiles a debug APK, and uploads it as a downloadable workflow artifact.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java (required by the Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build the web app
        run: npm run build

      - name: Add the native Android project
        run: npx cap add android

      - name: Sync web assets and plugins into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-gallery-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
